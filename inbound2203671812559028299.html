<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="description" content="Mourad Mehdioui — Official DJ Website">
<title>Mourad Mehdioui | DJ</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,sans-serif;background:#050609;color:#fff}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:35px;
background:radial-gradient(circle at 50% 25%,#18351f 0,#0b1110 35%,#050609 75%)}
.card{max-width:950px}.butterfly{font-size:78px;filter:drop-shadow(0 0 20px #6cff9b);animation:float 3s ease-in-out infinite}
h1{font-size:clamp(42px,8vw,88px);margin:10px 0;background:linear-gradient(90deg,#fff,#6cff9b,#8ad8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-weight:400;color:#c9d2d8}p{color:#c4cdd2;font-size:18px}
.btn{display:inline-block;margin:10px;padding:14px 25px;border:1px solid #6cff9b;border-radius:30px;color:#fff;text-decoration:none;transition:.25s}
.btn:hover{background:#6cff9b;color:#061008}
section{padding:70px 20px;max-width:1000px;margin:auto}h3{font-size:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.box{padding:28px;border:1px solid #26352d;border-radius:18px;background:#0d1313;text-align:center;box-shadow:0 8px 30px #0005}
.facebook{border-color:#4267B2}
footer{text-align:center;padding:30px;color:#89959c;border-top:1px solid #18201d}
@keyframes float{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="hero"><div class="card">
<div class="butterfly">🦋</div>
<h1>MOURAD MEHDIOUI</h1>
<h2>DJ • MUSIC • ENERGY</h2>

<a class="btn" href="#music">🎧 الموسيقى</a>
<a class="btn" href="#videos">🎬 الفيديوهات</a>
</div></div>

<section id="music">
<h3>🎧 الموسيقى</h3>
<div class="grid">
<div class="box">Electronic Dance Music</div>
<div class="box">Live DJ Mixes</div>
<div class="box">Future Beats</div>
</div>
</section>

<section id="videos">

<section>
